name: Windows build and release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and build dependencies
        run: python -m pip install ".[build]"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build standalone Windows executable
        run: >-
          pyinstaller --clean --noconfirm --onefile --windowed
          --name SpicetifyAutoUpdater --specpath build --paths src
          src\spicetify_autoupdater\__main__.py

      - name: Upload executable for manual workflow runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SpicetifyAutoUpdater-windows
          path: dist/SpicetifyAutoUpdater.exe
          if-no-files-found: error

      - name: Publish executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SpicetifyAutoUpdater.exe
